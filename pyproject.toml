[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elizabeth-anne-alexander"
dynamic = ["version"]
description = "A fixed-policy, synthetic-data review boundary for AI-assisted Xero trial-balance analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["xero", "ai-agents", "accounting", "privacy", "controls"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "elizabeth_anne_alexander.version.__version__" }

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
elizabeth-anne-alexander = "elizabeth_anne_alexander.cli:main"

[tool.setuptools]
packages = ["elizabeth_anne_alexander"]
include-package-data = false

[tool.setuptools.package-data]
elizabeth_anne_alexander = [
  "policy/*.json",
  "samples/contexts/*.json",
  "samples/decisions/*.json",
  "samples/inputs/*.csv",
  "samples/manifests/*.json",
  "samples/requests/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
