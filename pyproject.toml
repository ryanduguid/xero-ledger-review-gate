[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elizabeth-anne-alexander"
dynamic = ["version"]
description = "A fixed-policy, synthetic-data review boundary for AI-assisted Xero trial-balance analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["xero", "ai-agents", "accounting", "privacy", "controls"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
]
[project.urls]
Homepage = "https://github.com/ryanduguid/ElizabethAnneAlexander"
Repository = "https://github.com/ryanduguid/ElizabethAnneAlexander.git"
Issues = "https://github.com/ryanduguid/ElizabethAnneAlexander/issues"

[tool.setuptools.dynamic]
version = { attr = "elizabeth_anne_alexander.version.__version__" }

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14","build>=1.2", "pytest>=8"]

[project.scripts]
elizabeth-anne-alexander = "elizabeth_anne_alexander.cli:main"

[tool.setuptools]
packages = ["elizabeth_anne_alexander"]
include-package-data = false

[tool.setuptools.package-data]
elizabeth_anne_alexander = [
  "policy/*.json",
  "samples/contexts/*.json",
  "samples/decisions/*.json",
  "samples/inputs/*.csv",
  "samples/manifests/*.json",
  "samples/requests/*.json",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["elizabeth_anne_alexander", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["elizabeth_anne_alexander"]
ignore_missing_imports = true
pretty = true

