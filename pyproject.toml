[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xero-ai-review-gateway"
version = "0.1.0"
description = "A fixed-policy, synthetic-data review boundary for AI-assisted Xero trial-balance analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["xero", "ai-agents", "accounting", "privacy", "controls"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
xero-ai-review-gateway = "xero_ai_review_gateway.cli:main"

[tool.setuptools]
packages = ["xero_ai_review_gateway"]
include-package-data = false

[tool.setuptools.package-data]
xero_ai_review_gateway = [
  "policy/*.json",
  "samples/contexts/*.json",
  "samples/decisions/*.json",
  "samples/inputs/*.csv",
  "samples/manifests/*.json",
  "samples/requests/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
